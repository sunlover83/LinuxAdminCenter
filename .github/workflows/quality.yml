name: Quality Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install quality and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck build-essential debhelper dpkg-dev lintian

      - name: Run tests
        run: bash tests/run_tests.sh

      - name: Build and validate Debian package
        run: bash tests/debian_package_build.sh

      - name: Validate Debian package lifecycle
        run: bash tests/debian_package_lifecycle.sh

      - name: Run Lintian
        run: bash tests/debian_package_lint.sh

      - name: Run ShellCheck
        run: shellcheck install.sh uninstall.sh debian/preinst scripts/*.sh src/lac.sh src/core/*.sh src/modules/*/*.sh tests/*.sh

      - name: Build Debian package artifact
        env:
          DEB_BUILD_OPTIONS: nocheck
        run: bash scripts/build_debian_package.sh dist

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-admin-center-debian
          path: dist/linux-admin-center_*_all.deb
          if-no-files-found: error

  portability:
    name: Portability (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian stable
            distro: debian
            image: debian:stable-slim
          - name: Fedora
            distro: fedora
            image: fedora:latest
          - name: Arch Linux
            distro: arch
            image: archlinux:latest
          - name: openSUSE Tumbleweed
            distro: opensuse
            image: opensuse/tumbleweed:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run portability tests
        env:
          DISTRO: ${{ matrix.distro }}
          IMAGE: ${{ matrix.image }}
        run: |
          case "$DISTRO" in
            debian)
              setup='apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install --yes bash coreutils grep sed gawk findutils'
              ;;
            fedora)
              setup='dnf install --assumeyes bash coreutils grep sed gawk findutils'
              ;;
            arch)
              setup='pacman -Sy --noconfirm --needed bash coreutils grep sed gawk findutils'
              ;;
            opensuse)
              setup='zypper --non-interactive install --no-recommends bash coreutils grep sed gawk findutils'
              ;;
            *)
              printf 'Unsupported CI distribution: %s\n' "$DISTRO" >&2
              exit 2
              ;;
          esac

          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --workdir /workspace \
            "$IMAGE" \
            /bin/bash -lc "$setup && bash tests/portability_test.sh"
